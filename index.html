<title>Ledger</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap" rel="stylesheet">
<style>
  /* ===== Theme: AnuPpuccin — Rosé Pine Dawn (light) + Frappé (dark), custom teals ===== */
  .t-light{--ground:#F2E9E1;--card:#FFFAF3;--sunk:#F4EDE8;--line:#DFDAD9;--line2:#CECACD;--text:#575279;--sub:#64607D;--in:#45405F;--accent:#18789E;--on-accent:#FFFAF3;--peach:#C66A52;--love:#B4637A;--iris:#6D5889;--ok:#B7D5D8;--low:#F3CF97;--out:#E6B3BF;--save:#D3C6E1;--save2:#E6DDF0;--his:#9CBFD3;--hers:#F0CBC6;--plus:#286983;--minus:#B4637A;--move:#6D5889;--sel:#E3EEF0;--scrim:rgba(87,82,121,.38);--shadow:rgba(87,82,121,.10);--bubble:rgba(255,255,255,.75);color-scheme:light}
  .t-dark{--ground:#232634;--card:#303446;--sunk:#292C3C;--line:#414559;--line2:#51576D;--text:#C6D0F5;--sub:#A5ADCE;--in:#EEF1FF;--accent:#11B7C5;--on-accent:#232634;--peach:#EF9F76;--love:#E78284;--iris:#CA9EE6;--ok:#24687A;--low:#6E6556;--out:#79535F;--save:#6E5E86;--save2:#5A4E70;--his:#46557A;--hers:#8A6356;--plus:#A6D189;--minus:#E78284;--move:#CA9EE6;--sel:#28495A;--scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.28);--bubble:rgba(255,255,255,.3);color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;max-width:100vw}
  body{background:var(--ground);color:var(--text);font-family:ui-serif,'New York','Newsreader',Georgia,serif;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;font-size:16px}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  .wrap{max-width:480px;margin:0 auto}
  .view{display:none}.view.active{display:block}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* header */
  .hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px}
  .hello .date{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .hello h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-top:2px}
  .avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px;cursor:pointer;flex-shrink:0;position:relative}
  .avatar.has-badge::after,.row-badge::after{content:'';position:absolute;top:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--peach);border:2px solid var(--ground)}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--line2);display:inline-block}
  .sync-dot.ok{background:#56949F}.sync-dot.pending{background:#EA9D34}.sync-dot.off{background:var(--love)}
  .page-title{font-size:30px;font-weight:800;padding:0 4px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .back-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
  .chip-btn{margin:14px 4px 0;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:none;background:var(--card);color:var(--text);font-size:15px;box-shadow:0 1px 4px var(--shadow);cursor:pointer}
  .chip-btn b{font-size:17px;font-weight:800}
  .chip-btn span{color:var(--sub)}
  .scope-tabs{margin:14px 0 4px;display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--accent)}
  .scope-tabs button{height:40px;border:none;border-radius:8px;background:transparent;font-weight:600;font-size:15px;color:var(--on-accent);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
  .scope-tabs button.on{background:var(--card);color:var(--text);font-weight:700}
  .hint{margin:14px 4px 12px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sub);font-style:italic;min-height:22px}
  .hint svg{color:var(--accent);flex-shrink:0}
  .banner{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px dashed var(--line2);font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner.demo{border-style:solid;border-color:var(--accent);background:var(--sel)}
  .banner button{border:none;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;flex-shrink:0}

  /* cards & tanks */
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 12px var(--shadow);position:relative}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 10px}
  .card-title{font-weight:800;font-size:18px;color:var(--love)}
  .card-meta{font-size:14px;color:var(--sub);text-align:right}
  .plumbing{position:relative}
  .spine{position:absolute;left:50%;width:12px;margin-left:-6px;border-radius:6px;background:var(--line);top:100px;bottom:60px}
  .tank-grid{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px;row-gap:14px}
  .tank-cell{position:relative}

  .tank{position:relative;height:118px;border-radius:14px;background:var(--card);border:2px solid var(--line2);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}

  .tank-text{position:absolute;top:10px;left:12px;right:10px;pointer-events:none;color:var(--in);z-index:1}

    .toggle-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--accent);margin-bottom:14px}

  .entry-tag .ico{vertical-align:-2px}

  .chip .mono,.entry-note .mono,.profile-group-label .mono{margin-right:6px;vertical-align:-4px}
  .entry-note .mono{vertical-align:-3px}
  .avatar{display:flex;align-items:center;justify-content:center;padding:0}
  .mono-pair{display:inline-flex}.mono-pair .mono+.mono{margin-left:-7px;box-shadow:0 0 0 2px var(--card)}
  .glyph-btn{flex:0 0 46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .glyph-btn[aria-expanded=true]{border-color:var(--accent)}
  .glyph-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:10px;margin:0 0 10px;border-radius:12px;background:var(--sunk)}

  .glyph-opt.auto{grid-column:span 2;gap:6px;font-size:13px;font-weight:700}
  .wish-check .ico{color:inherit}

  /* pouring: a crisp line along the plumbing while dragging */
  .pour{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3;opacity:0;transition:opacity .15s ease}
  .pour.on{opacity:1}
  .pour path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pour-base{stroke:var(--accent);stroke-width:3;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
  .pour.on .pour-base{animation:pourDraw .16s cubic-bezier(.3,0,.2,1) forwards}
  .pour-flow{stroke:var(--card);stroke-width:1.6;stroke-dasharray:3 13;opacity:0;transition:opacity .12s}
  .pour.on:not(.idle) .pour-flow{opacity:.95;animation:pourRun .32s linear infinite}
  .pour.on.back .pour-flow{animation-direction:reverse}
  .pour.idle .pour-base{opacity:.55}
  .pour-tag{position:absolute;transform:translateX(-50%);z-index:4;pointer-events:none;font-weight:800;font-size:15px;line-height:1;padding:6px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px var(--shadow);font-variant-numeric:tabular-nums;white-space:nowrap}

  .pour-tag.back{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
  .pouring .liquid{transition:none}
  @keyframes pourDraw{to{stroke-dashoffset:0}}
  @keyframes pourRun{to{stroke-dashoffset:-16}}

  /* sheet slide up / down */
  .modal-overlay.opening{opacity:0;transition:none}
  .modal-overlay.opening .modal{transform:translateY(100%);transition:none}
  .modal-overlay.closing{opacity:0;pointer-events:none}
  .modal-overlay.closing .modal{transform:translateY(105%)!important;transition:transform .26s cubic-bezier(.5,0,.75,0)}

  /* impact: hit (spending) and heal (income) */
  .impact-dim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:60}
  .impact-dim.on{opacity:1;pointer-events:auto}
  .spot{z-index:61}
  .tank-cell.spot,.card.spot{position:relative}
  .ghost{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
  .ghost.dmg{background:var(--minus);opacity:.45}
  .ghost.heal{background:var(--plus);opacity:.35}
  .tank.hit{animation:hitShake .32s cubic-bezier(.36,.07,.19,.97);border-color:var(--minus)}
  .tank.heal,.impact-card.heal{animation:healGlow 1.1s ease-out}
  .tank.heal{border-color:var(--plus)}
  .impact-float{position:fixed;transform:translate(-50%,0);z-index:62;pointer-events:none;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 0 var(--card),0 0 10px var(--card);animation:floatUp 1.2s cubic-bezier(.2,.8,.3,1) forwards}
  .impact-float.dmg{color:var(--minus)}.impact-float.heal{color:var(--plus)}
  .impact-card{position:fixed;left:50%;top:36%;width:min(88vw,360px);transform:translate(-50%,-50%) scale(.94);opacity:0;z-index:61;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 12px 40px var(--shadow);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.25,1)}
  .impact-card.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .impact-card.hit{animation:hitShakeCard .32s cubic-bezier(.36,.07,.19,.97)}
  .ic-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:15px;color:var(--sub);font-style:italic}
  .ic-title b{font-style:normal;font-size:22px;font-weight:800}
  .ic-title b.expense{color:var(--minus)}.ic-title b.income{color:var(--plus)}.ic-title b.transfer{color:var(--move)}
  .ic-row{display:flex;gap:12px;align-items:center}
  .ic-main{flex:1;min-width:0}
  .ic-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
  .ic-amt{font-weight:800;font-variant-numeric:tabular-nums}
  .ic-bar{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
  .ic-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .ic-bar .ic-fill{background:var(--accent)}
  .ic-bar .ghost{right:auto}
  .ic-arrow{display:flex;justify-content:center;color:var(--move);margin:6px 0}
  @keyframes hitShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  @keyframes hitShakeCard{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 5px),-50%)}40%{transform:translate(calc(-50% + 4px),-50%)}60%{transform:translate(calc(-50% - 3px),-50%)}80%{transform:translate(calc(-50% + 2px),-50%)}}
  @keyframes healGlow{0%{box-shadow:0 0 0 0 var(--plus)}40%{box-shadow:0 0 0 6px color-mix(in srgb,var(--plus) 35%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-46px)}}
  @media (prefers-reduced-motion: reduce){.modal-overlay,.modal,.impact-dim{transition:none}}

  /* Together: who's who, splits, layered waves */
  .wave.save path{fill:var(--save)}
  .wave.w1{animation-delay:-1.7s;animation-duration:3.9s}.wave.w2{animation-delay:-.9s}
  .layer{overflow:visible}
  .who-key{display:flex;gap:16px;flex-wrap:wrap;margin:12px 6px 0;font-size:14px;color:var(--sub)}
  .who-key span,.split{display:inline-flex;align-items:center;gap:6px}
  .who-key i,.split i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line2);flex-shrink:0}

  .person-rows{display:grid;gap:10px;margin:4px 0 12px}
  .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
  .pmain{flex:1;min-width:0}
  .ptop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ptop span{font-weight:800;font-variant-numeric:tabular-nums}.ptop em{font-weight:400;color:var(--sub);font-size:13px}
  .prow .bar{margin-top:6px;background:var(--card)}
  /* Savings tank: past savings band + this month's pour, draggable like the others */

  .save-base{position:absolute;left:0;right:0;bottom:0;background:var(--iris);opacity:.18;pointer-events:none;z-index:1}

</style>

    if (syncBlocked) return setSyncStatus('blocked');
    if (!serverLoaded) return setSyncStatus(dbRef ? 'connecting' : 'off');
    if (Object.keys(pending).length) return setSyncStatus(navigator.onLine === false ? 'offline' : 'pending');
    setSyncStatus('ok');
  }

  function persist() {
    ensureOrd(state);
    const cur = snapshot(state);
    const base = baseline || {};
    const ops = {};
    COLLECTIONS.forEach(col => {
      const a = base[col] || {}, b = cur[col] || {};
      Object.keys(b).forEach(id => { if (a[id] !== b[id]) ops[col + '/' + id] = JSON.parse(b[id]); });
      Object.keys(a).forEach(id => { if (!(id in b)) ops[col + '/' + id] = null; });
    });
    SCALARS.forEach(k => { if (base[k] !== cur[k]) ops[k] = JSON.parse(cur[k]); });
    baseline = cur;
    if (Object.keys(ops).length) { Object.assign(pending, ops); savePending(); }
    cacheLocally();
    if (DEMO) { pending = {}; return; }
    refreshSyncStatus();
    flush();
  }

  function flush() {
    if (DEMO || !dbRef || !schemaReady || flushing || syncBlocked) return;
    const keys = Object.keys(pending);
    if (!keys.length) { refreshSyncStatus(); return; }
    const batch = {};
    keys.forEach(k => { batch[k] = pending[k]; });
    flushing = true;
    dbRef.update(batch).then(() => {
      flushing = false;
      Object.keys(batch).forEach(k => { if (k in pending && stable(pending[k]) === stable(batch[k])) delete pending[k]; });
      savePending();
      refreshSyncStatus();
      if (Object.keys(pending).length) flush();
    }).catch(err => {
      flushing = false;
      console.error('Sync write failed:', err);
      if (err && /permission/i.test(String(err.code || err.message))) syncBlocked = true;
      refreshSyncStatus();
    });
  }

  function connectDatabase() {
    if (dbRef) dbRef.off();
    rootRef = firebase.database().ref();
    dbRef = rootRef.child(DB_PATH);
    schemaReady = false; serverLoaded = false; syncBlocked = false;
    refreshSyncStatus();
    dbRef.on('value', snap => {
      const val = snap.val();
      if (!val || val.schemaVersion !== SCHEMA_VERSION) { migrateFromLegacy(); return; }
      schemaReady = true;
      syncBlocked = false;
      if (drag) { pendingServerVal = val; return; } // don't yank the water out from under a finger mid-drag
      applyServer(val);
    }, err => {
      console.error('Firebase read error:', err);
      if (err && /permission/i.test(String(err.code || err.message))) syncBlocked = true;
      refreshSyncStatus();
    });
  }
  let pendingServerVal = null;
  function applyServer(val) {
    state = stateFromRaw(applyOps(val, pending));
    baseline = snapshot(state);
    serverLoaded = true;
    cacheLocally();
    const changed = afterLoad();
    if (changed) persist();
    renderAll();
    refreshSyncStatus();
    flush();
    maybeShowWrapUp();
  }

  // One-time copy from the old storage spot (ledger-data, a single blob) to the new one (ledger-v2). The old data stays as a backup.
  function migrateFromLegacy() {
    if (migrating) return;
    migrating = true;
    rootRef.child(LEGACY_DB_PATH).once('value').then(snap => {
      const legacy = snap.val();
      const src = legacy ? stateFromRaw(legacy) : state;
      const payload = { schemaVersion: SCHEMA_VERSION, migratedFrom: legacy ? LEGACY_DB_PATH : 'this-device', migratedAt: new Date().toISOString() };
      COLLECTIONS.forEach(col => { const m = {}; src[col].forEach(it => { m[it.id] = cleanItem(it); }); payload[col] = m; });
      SCALARS.forEach(k => { payload[k] = src[k]; });
      return dbRef.transaction(cur => (cur && cur.schemaVersion === SCHEMA_VERSION) ? undefined : payload);
    }).then(() => { migrating = false; }).catch(err => {
      migrating = false;
      console.error('Migration failed:', err);
      if (err && /permission/i.test(String(err.code || err.message))) syncBlocked = true;
      refreshSyncStatus();
    });
  }

  function initFirebaseApp(config) {
    try {
      if (!firebase.apps.length) firebase.initializeApp(config);
      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          $('loginOverlay').classList.remove('active');
          unlockBodyScroll();
          connectDatabase();
        } else {
          if (dbRef) dbRef.off();
          dbRef = null; serverLoaded = false;
          refreshSyncStatus();
          setLoginMode('login');
          $('loginOverlay').classList.add('active');
          lockBodyScroll();
        }
      });
      authReady = true;
    } catch (e) {
      console.error('Firebase init error:', e);
      setSyncStatus('off');
    }
  }
  window.addEventListener('online', () => { refreshSyncStatus(); flush(); });
  window.addEventListener('offline', refreshSyncStatus);

  // Runs after data loads: seeds subcategories once, posts due recurring entries, starts tanks from old budgets.
  function afterLoad() {
    let changed = seedDefaultSubcategoriesIfNeeded(state);
    if (postRecurring()) changed = true;
    if (seedAllocationsFromBudgets()) changed = true;
    return changed;
  }
  function seedDefaultSubcategoriesIfNeeded(s) {
    if (s.seededSubcategoriesV1) return false;
    Object.entries(SEED_SUBCATEGORIES).forEach(([parentId, subs]) => {
      const parent = s.categories.find(c => c.id === parentId);
      if (!parent || s.categories.some(c => c.parentId === parentId)) return;
      subs.forEach((sub, i) => { s.categories.push({ id: uid() + i, name: sub.name, icon: sub.icon, type: parent.type, parentId: parent.id, ord: Date.now() + i }); });
    });
    s.seededSubcategoriesV1 = true;
    return true;
  }
  // First time tanks are used: a person's old monthly budgets become this month's tank amounts.
  function seedAllocationsFromBudgets() {
    const month = monthKey();
    let changed = false;
    state.profiles.forEach(p => {
      if (state.allocations.some(a => a.profileId === p.id)) return;
      const budgets = state.budgets.filter(b => b.scope === p.id && b.amount > 0 && state.categories.some(c => c.id === b.categoryId));
      budgets.forEach(b => { setAlloc(p.id, month, b.categoryId, b.amount); changed = true; });
    });
    return changed;
  }

  // ---------- theme ----------
  let themePref = load(THEME_KEY) || 'system';
  const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    if (themePref !== 'system') return themePref === 'dark';
    const host = document.documentElement.getAttribute('data-theme'); // a preview panel can force light/dark
    if (host === 'dark' || host === 'light') return host === 'dark';
    return !!(darkMQ && darkMQ.matches);
  }
  function applyTheme() {
    const dark = isDark();
    document.documentElement.classList.toggle('t-dark', dark);
    document.documentElement.classList.toggle('t-light', !dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#232634' : '#F2E9E1');
  }
  try { new MutationObserver(() => applyTheme()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  if (darkMQ) { const h = () => { applyTheme(); if ($('view-insights').classList.contains('active')) renderInsights(); }; if (darkMQ.addEventListener) darkMQ.addEventListener('change', h); else if (darkMQ.addListener) darkMQ.addListener(h); }
  function palette() { return isDark() ? ['#81C8BE', '#E78284', '#E5C890', '#8CAAEE', '#CA9EE6', '#F4B8E4', '#EF9F76', '#A6D189', '#99D1DB', '#A5ADCE'] : ['#56949F', '#B4637A', '#EA9D34', '#286983', '#907AA9', '#D7827E', '#DD7F67', '#7FA36B', '#6E9FB4', '#9893A5']; }

  // ---------- lookups ----------
  function profileById(id) { return state.profiles.find(p => p.id === id) || { name: 'Unknown', icon: '❓' }; }
  function catById(id) { return state.categories.find(c => c.id === id) || { name: 'Uncategorized', icon: '❓' }; }
  function walletById(id) { return state.wallets.find(w => w.id === id) || { name: 'Unknown', icon: '❓' }; }
  function topCategoryId(catId) { const c = catById(catId); return c.parentId || catId; }
  function subsOf(parentId) { return state.categories.filter(c => c.parentId === parentId); }
  function categoryLabel(catId) { const c = catById(catId); if (!c.parentId) return c.name; return catById(c.parentId).name + ' › ' + c.name; }
  function groupedCategoryOptionsHTML(type, selectedId) {
    const tops = state.categories.filter(c => c.type === type && !c.parentId);
    return tops.map(top => {
      const subs = subsOf(top.id);
      if (!subs.length) return `<option value="${top.id}" ${top.id === selectedId ? 'selected' : ''}>${esc(top.name)}</option>`;
      const generalOpt = `<option value="${top.id}" ${top.id === selectedId ? 'selected' : ''}>${esc(top.name)} (general)</option>`;
      const subOpts = subs.map(s => `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>&nbsp;&nbsp;↳ ${esc(s.name)}</option>`).join('');
      return `<optgroup label="${esc(top.name)}">${generalOpt}${subOpts}</optgroup>`;
    }).join('');
  }
  function walletOptionsHTML(wallets, selectedId, prefix, excludeId) {
    const list = wallets.filter(w => w.id !== excludeId);
    const profilesUsed = [...new Set(list.map(w => w.profileId))];
    const opt = w => `<option value="${w.id}" ${w.id === selectedId ? 'selected' : ''}>${prefix || ''}${esc(w.name)}</option>`;
    if (profilesUsed.length <= 1) return list.map(opt).join('');
    return state.profiles.filter(p => profilesUsed.includes(p.id)).map(p =>
      `<optgroup label="${esc(p.name)}">${list.filter(w => w.profileId === p.id).map(opt).join('')}</optgroup>`).join('');
  }
  function currencyOptionsHTML(selected) { return ['PHP'].concat(Object.keys(state.rates)).map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join(''); }

  // ---------- scope & period ----------
  let viewScope = load(VIEW_SCOPE_KEY) || 'p1';
  let period = load(PERIOD_KEY) || 'month';
  const PERIODS = ['month', 'last', 'all'];
  function periodLabel(p) { return p === 'month' ? 'This month' : p === 'last' ? monthName(prevMonthKey(monthKey())) : 'All time'; }
  function periodBounds(p) {
    const n = new Date();
    if (p === 'month') return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 1)];
    if (p === 'last') return [new Date(n.getFullYear(), n.getMonth() - 1, 1), new Date(n.getFullYear(), n.getMonth(), 1)];
    return null;
  }
  function inPeriod(e, p) { const b = periodBounds(p || period); if (!b) return true; const d = new Date(e.date); return d >= b[0] && d < b[1]; }
  function scopeProfileIds() { return viewScope === 'combined' ? state.profiles.map(p => p.id) : [viewScope]; }
  function entryProfileIds(e) {
    const ids = [e.profileId];
    if (e.type === 'transfer') { const tw = state.wallets.find(w => w.id === e.toWalletId); if (tw) ids.push(tw.profileId); }
    return ids;
  }
  function entriesInScope() { const ids = scopeProfileIds(); return state.entries.filter(e => entryProfileIds(e).some(p => ids.includes(p))); }
  function walletsInScope() { const ids = scopeProfileIds(); return state.wallets.filter(w => ids.includes(w.profileId)); }
  function walletBalance(w) {
    let b = Number(w.startingBalance) || 0;
    state.entries.forEach(e => {
      if (e.type === 'income' && e.walletId === w.id) b += e.amountPHP;
      else if (e.type === 'expense' && e.walletId === w.id) b -= e.amountPHP;
      else if (e.type === 'transfer') { if (e.walletId === w.id) b -= e.amountPHP; if (e.toWalletId === w.id) b += e.amountPHP; }
    });
    return b;
  }
  function setScope(s) { viewScope = s; store(VIEW_SCOPE_KEY, s); renderAll(); maybeShowWrapUp(); }
  function renderScopeTabs() {
    const tabs = state.profiles.map(p => ({ id: p.id, label: p.name })).concat([{ id: 'combined', label: 'Together' }]);
    $$('[data-scope-tabs]').forEach(box => {
      box.style.gridTemplateColumns = `repeat(${tabs.length}, minmax(0, 1fr))`;
      box.innerHTML = tabs.map(t => `<button class="${viewScope === t.id ? 'on' : ''}" data-scope="${t.id}" aria-pressed="${viewScope === t.id}">${esc(t.label)}</button>`).join('');
      $$('[data-scope]', box).forEach(b => b.addEventListener('click', () => setScope(b.dataset.scope)));
    });
  }

  // ---------- tank model ----------
  function monthRange(month) { const [y, m] = month.split('-').map(Number); return [new Date(y, m - 1, 1), new Date(y, m, 1)]; }
  function monthEntries(pids, month) {
    const [a, b] = monthRange(month);
    return state.entries.filter(e => pids.includes(e.profileId) && (d => d >= a && d < b)(new Date(e.date)));
  }
  function incomeOf(pids, month) { return monthEntries(pids, month).filter(e => e.type === 'income').reduce((s, e) => s + e.amountPHP, 0); }
  function expenseOf(pids, month) { return monthEntries(pids, month).filter(e => e.type === 'expense').reduce((s, e) => s + e.amountPHP, 0); }
  function allocId(pid, month, cat) { return pid + '__' + month + '__' + cat; }
  function allocAmt(pid, month, cat) { const a = state.allocations.find(x => x.id === allocId(pid, month, cat)); return a ? a.amount : 0; }
  function hasAlloc(pid, month, cat) { return state.allocations.some(x => x.id === allocId(pid, month, cat)); }
  function setAlloc(pid, month, cat, amount) {
    const id = allocId(pid, month, cat);
    const ex = state.allocations.find(x => x.id === id);
    if (ex) ex.amount = round2(amount);
    else state.allocations.push({ id, profileId: pid, month, categoryId: cat, amount: round2(amount), ord: Date.now() });
  }
  function removeAlloc(pid, month, cat) { state.allocations = state.allocations.filter(x => x.id !== allocId(pid, month, cat)); }
  function allocTotal(pids, month) { return state.allocations.filter(a => pids.includes(a.profileId) && a.month === month).reduce((s, a) => s + a.amount, 0); }
  function spentOf(pids, month, cat) { return monthEntries(pids, month).filter(e => e.type === 'expense' && topCategoryId(e.categoryId) === cat).reduce((s, e) => s + e.amountPHP, 0); }
  function tankCats(pids, month) {
    const set = new Set();
    state.allocations.filter(a => pids.includes(a.profileId) && a.month === month).forEach(a => set.add(a.categoryId));
    monthEntries(pids, month).filter(e => e.type === 'expense').forEach(e => set.add(topCategoryId(e.categoryId)));
    return state.categories.filter(c => c.type === 'expense' && !c.parentId && set.has(c.id)).map(c => c.id);
  }
  function firstPlanMonth(pids) { const ms = state.allocations.filter(a => pids.includes(a.profileId)).map(a => a.month).sort(); return ms[0] || null; }
  // Savings: from the first month a plan existed, every finished month's leftover (income minus spending) flows in.
  function savingsHistory(pids) {
    const first = firstPlanMonth(pids), cur = monthKey(), rows = [];
    if (!first) return rows;
    for (let m = first; m < cur; m = nextMonthKey(m)) rows.push({ month: m, amount: round2(incomeOf(pids, m) - expenseOf(pids, m)) });
    return rows;
  }
  function savingsOf(pids) { return savingsHistory(pids).reduce((s, r) => s + r.amount, 0); }
  // Money poured into Savings this month is stored like a tank amount under a reserved id. It is never spent from;
  // at month end Savings still grows by income minus spending, and what was set aside is part of that, not extra.
  const SAVE = '__savings';
  function pourOf(pids, month) { return pids.reduce((s, p) => s + allocAmt(p, month, SAVE), 0); }
  // Savings tank geometry: past savings fill a fixed band at the bottom; the rest of the height is this month's pourable range.
  function saveGeom(pid, month) {
    const past = savingsOf([pid]), pour = allocAmt(pid, month, SAVE);
    const avail = Math.max(pour, pour + incomeOf([pid], month) - allocTotal([pid], month));
    const p0 = past > 0 ? Math.max(10, Math.min(35, past / (past + Math.max(avail, 1)) * 100)) : 0, span = 94 - p0;
    return { past, pour, avail, p0, val: f => avail > 0 ? Math.max(0, (f * 100 - p0) / span * avail) : 0, pct: v => p0 + (avail > 0 ? Math.max(0, Math.min(1, v / avail)) * span : 0) };
  }
  // Stacked layers for the Together view: one per person, each with its own wave.
  function stackHTML(heights, pids) {
    let b = 0;
    return heights.map((h, i) => {
      const tone = personTone(pids[i]).slice(2), out = `<div class="layer" style="bottom:${b}%;height:${h}%;background:var(--${tone});z-index:${heights.length - i}">${h > 0.4 ? wave(tone + ' w' + i) : ''}</div>`;
      b += h; return out;
    }).join('');
  }
  function splitHTML(vals, pids) { return `<span class="split-row">${vals.map((v, i) => `<span class="split"><i style="background:var(${personTone(pids[i])})"></i>${v < 0 ? peso(-v) + ' over' : peso(v)}</span>`).join('')}</span>`; }
  function tankInfo(pid, month, cat) {
    const alloc = allocAmt(pid, month, cat), spent = spentOf([pid], month, cat);
    return { alloc, spent, remaining: alloc - spent };
  }
  function toneOf(alloc, remaining) {
    if (remaining <= 0) return 'out';
    const r = alloc ? remaining / alloc : 0;
    return r > 0.35 ? 'ok' : r > 0.15 ? 'low' : 'out';
  }
  function niceScale(maxAlloc) { const raw = Math.max(1000, maxAlloc * 1.15); const step = raw > 20000 ? 5000 : raw > 5000 ? 1000 : 500; return Math.ceil(raw / step) * step; }

  // ---------- tanks view ----------
  let tankScale = 13000;
  function renderTanks() {
    const isT = viewScope === 'combined', pids = scopeProfileIds(), month = monthKey();
    const prof = profileById(viewScope);
    $('todayLabel').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    $('greeting').textContent = isT ? 'You two, together' : 'Hi, ' + prof.name;
    $('avatarBtn').innerHTML = isT ? `<span class="mono-pair">${state.profiles.slice(0, 2).map(p => mono(p, 30)).join('')}</span>` : mono(prof, 40);
    $('avatarBtn').classList.toggle('has-badge', hasUnseenPatchNotes());
    const ws = walletsInScope();
    $('walletChipAmt').textContent = peso(ws.reduce((s, w) => s + walletBalance(w), 0));
    $('walletChipText').textContent = 'across ' + ws.length + (ws.length === 1 ? ' wallet' : ' wallets');

    // banner
    let banner = '';
    if (DEMO) banner += `<div class="banner demo"><span>Demo with sample data — nothing here touches your real ledger.</span></div>`;
    if (!isT && !state.allocations.some(a => a.profileId === viewScope && a.month === month)) {
      const prev = prevMonthKey(month);
      if (state.allocations.some(a => a.profileId === viewScope && a.month === prev)) banner += `<div class="banner"><span>New month, empty tanks.</span><button id="repeatPlanBtn">Repeat ${esc(monthName(prev))}'s plan</button></div>`;
    }
    if (isT) banner += `<div class="who-key">${state.profiles.map(p => `<span><i style="background:var(${personTone(p.id)})"></i>${esc(p.name)}</span>`).join('')}</div>`;
    $('tankBanner').innerHTML = banner;
    if ($('repeatPlanBtn')) $('repeatPlanBtn').addEventListener('click', () => { repeatPlan(viewScope, prevMonthKey(month), month); });

    const cats = tankCats(pids, month);
    const tanks = cats.map(cat => {
      const per = pids.map(pid => tankInfo(pid, month, cat));
      const alloc = per.reduce((s, x) => s + x.alloc, 0), spent = per.reduce((s, x) => s + x.spent, 0);
      return { cat, per, alloc, spent, remaining: alloc - spent };
    });
    tankScale = niceScale(Math.max(0, ...tanks.map(t => t.alloc)));
    const income = incomeOf(pids, month), planned = allocTotal(pids, month), unassigned = income - planned;

    // income tank
    let incomeLiquid, incomeText;
    if (isT) {
      const parts = pids.map(pid => Math.max(0, incomeOf([pid], month) - allocTotal([pid], month)));
      const denom = Math.max(income, 1);
      let room = 100; const hs = parts.map(v => { const h = Math.min(room, v / denom * 100); room -= h; return h; });
      incomeLiquid = stackHTML(hs, pids);
      incomeText = splitHTML(parts, pids);
    } else {
      const pct = income > 0 ? Math.max(0, Math.min(100, unassigned / income * 100)) : 0;
      incomeLiquid = `<div class="liquid" id="incomeLiquid" style="height:${pct}%">${wave()}<span class="bubble" style="left:22%"></span><span class="bubble b2" style="left:71%"></span></div>`;
    }
    const incomeSub = income <= 0 ? 'Log income with + to fill this tank' : unassigned < 0 ? peso(-unassigned) + ' more planned than came in' : isT ? 'ready to pour' : 'ready to pour into tanks';
    $('incomeCard').innerHTML = `
      <div class="card-head"><span class="card-title">Income tank</span><span class="card-meta">${peso(income)} came in this ${esc(monthName(month))}</span></div>
      <div class="tank big${isT ? ' together' : ' tone-ok'}">${incomeLiquid}
        <div class="center-text"><div class="v" id="incomeAmt">${peso(Math.max(0, unassigned))}</div><div class="o" id="incomeSub">${esc(incomeSub)}</div>${isT && income > 0 ? incomeText : ''}</div>
      </div>`;

    // category tanks
    $('tankGrid').innerHTML = tanks.map(t => tankHTML(t, isT)).join('') +
      (isT ? '' : `<div class="tank-cell"><div class="stub"></div><button class="add-tank" id="addTankBtn">${ico('plus', 16)} Add a tank</button></div>`);
    if (!tanks.length && isT) $('tankGrid').innerHTML = `<div class="empty-state" style="grid-column:1/-1">No tanks yet this month.</div>`;
    $$('#tankGrid .tank[data-cat]').forEach(el => {
      const cat = el.dataset.cat;
      el.addEventListener('click', () => { if (Date.now() - lastDragEnd < 400) return; openTankDetail(cat); });
      const grab = el.querySelector('.grab');
      if (grab) {
        grab.addEventListener('pointerdown', e => startDrag(e, cat, el));
        grab.addEventListener('pointermove', moveDrag);
        grab.addEventListener('pointerup', endDrag);
        grab.addEventListener('pointercancel', endDrag);
      }
    });
    $$('#tankGrid input[type=range]').forEach(r => r.addEventListener('change', () => {
      const cat = r.dataset.cat, info = tankInfo(viewScope, month, cat);
      const income2 = incomeOf([viewScope], month), others = allocTotal([viewScope], month) - info.alloc;
      const want = Math.round((info.spent + Number(r.value)) / 50) * 50;
      setAlloc(viewScope, month, cat, Math.max(Math.min(info.spent, info.alloc), Math.min(want, Math.max(info.alloc, income2 - others))));
      persist(); renderTanks();
    }));
    if ($('addTankBtn')) $('addTankBtn').addEventListener('click', openAddTank);

    // savings
    const hist = savingsHistory(pids), lastRow = hist[hist.length - 1];
    let saveInner, saveTotal;
    if (isT) {
      const parts = pids.map(pid => savingsOf([pid]) + allocAmt(pid, month, SAVE));
      saveTotal = parts.reduce((a, b) => a + b, 0);
      const pos = parts.map(v => Math.max(0, v)), tot = pos.reduce((a, b) => a + b, 0);
      saveInner = stackHTML(pos.map(v => tot > 0 ? v / tot * 72 : 0), pids) +
        `<div class="tank-text"><div class="v">${peso(saveTotal)}</div>${splitHTML(parts, pids)}</div>`;
    } else {
      const g = saveGeom(viewScope, month), pct = g.pct(g.pour);
      saveTotal = g.past + g.pour;
      saveInner = `<div class="liquid" data-liquid style="height:${pct}%">${wave()}<span class="bubble" style="left:40%"></span></div>
        ${g.p0 ? `<div class="save-base" style="height:${g.p0}%"></div>` : ''}

      <div class="tank big tone-save save-tank${isT ? ' together' : ''}" id="savingsTank" data-save role="button" tabindex="0" aria-label="Savings: ${esc(peso(saveTotal))}. Tap for history.">${saveInner}</div>

  }

  function tankHTML(t, isT) {
    const sc = tankScale;
    const cat = catById(t.cat);
    const label = `<div class="tank-text"><div class="n">${ci(cat)}${esc(cat.name)}</div><div class="v" data-left>${t.remaining < 0 ? peso(-t.remaining) + ' over' : peso(t.remaining)}</div><div class="o" data-of>${t.alloc ? 'left of ' + peso(t.alloc) : 'no budget yet'}</div></div>`;
    if (isT) {
      const pids = scopeProfileIds(), layers = stackHTML(t.per.map(p => Math.max(0, p.remaining) / sc * 100), pids);
      const tlabel = `<div class="tank-text"><div class="n">${ci(cat)}${esc(cat.name)}</div><div class="v">${t.remaining < 0 ? peso(-t.remaining) + ' over' : peso(t.remaining)}</div>${splitHTML(t.per.map(p => p.remaining), pids)}</div>`;
      return `<div class="tank-cell"><div class="stub"></div><div class="tank together${t.remaining < 0 ? ' over' : ''}" data-cat="${t.cat}" role="button" tabindex="0" aria-label="${esc(cat.name)}: ${esc(peso(t.remaining))} left of ${esc(peso(t.alloc))}">${layers}<div class="budget-line" style="bottom:${Math.min(98, t.alloc / sc * 100)}%"></div>${tlabel}</div></div>`;
    }

    return `<div class="tank-cell"><div class="stub" data-stub="${t.cat}"></div>
      <div class="tank tone-${toneOf(t.alloc, t.remaining)}${t.remaining < 0 ? ' over' : ''}" data-cat="${t.cat}" role="button" tabindex="0" aria-label="${esc(cat.name)}: ${esc(peso(t.remaining))} left of ${esc(peso(t.alloc))}. Tap for details.">
        <div class="budget-line" data-line style="bottom:${Math.min(98, t.alloc / sc * 100)}%"></div>
        <div class="liquid" data-liquid style="height:${pct}%">${wave()}<span class="bubble" style="left:30%"></span><span class="bubble b2" style="left:68%"></span></div>
        <div class="grab" data-grab style="bottom:${grabPos(pct)}"><div class="handle"></div></div>
        ${label}
      </div>
      <label class="sr-only">Money left in ${esc(cat.name)}<input type="range" data-cat="${t.cat}" min="0" max="${sc}" step="50" value="${rem}"></label></div>`;
  }

  function saveSub(pour, month) { return pour > 0 ? peso(pour) + ' set aside in ' + monthName(month) : 'nothing set aside this month'; }
  // ---------- pouring by drag ----------
  // The handle rides the water's surface but stays fully inside the tank, so an empty or full tank can still be grabbed.
  const grabPos = pct => `clamp(11px, ${pct}%, calc(100% - 11px))`;
  let drag = null, lastDragEnd = 0, dragFrame = 0;
  function pointerRemaining(y) { const r = drag.rect; return drag.geom.val(Math.max(0, Math.min(1, (r.bottom - y) / r.height))); }
  function startDrag(e, cat, tankEl) {
    if (viewScope === 'combined') return;
    e.preventDefault(); e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    const month = monthKey(), isSave = cat === SAVE, g = isSave ? saveGeom(viewScope, month) : null;
    const info = isSave ? { alloc: g.pour, spent: 0 } : tankInfo(viewScope, month, cat);
    const income = incomeOf([viewScope], month), others = allocTotal([viewScope], month) - info.alloc;
    const sc = tankScale;
    drag = { cat, isSave, month, tankEl, rect: tankEl.getBoundingClientRect(), startAlloc: info.alloc, alloc: info.alloc, spent: info.spent,
      geom: isSave ? g : { val: f => f * sc, pct: v => v / sc * 100 }, past: isSave ? g.past : 0,
      min: Math.min(info.spent, info.alloc), max: Math.max(info.alloc, income - others), income, others, y0: e.clientY, y: e.clientY, moved: false,
      els: { liquid: tankEl.querySelector('[data-liquid]'), grab: tankEl.querySelector('[data-grab]'), line: tankEl.querySelector('[data-line]'), left: tankEl.querySelector('[data-left]'), of: tankEl.querySelector('[data-of]') } };
    drag.offset = pointerRemaining(e.clientY) - Math.max(0, info.alloc - info.spent);
  }
  function moveDrag(e) {
    if (!drag) return;
    drag.y = e.clientY;
    if (!drag.moved) { if (Math.abs(e.clientY - drag.y0) < 4) return; drag.moved = true; drag.tankEl.classList.add('dragging'); showPour(); }
    if (!dragFrame) dragFrame = requestAnimationFrame(frameDrag); // one paint per frame, however many pointer events arrive
  }
  function frameDrag() {
    dragFrame = 0;
    if (!drag) return;
    const raw = pointerRemaining(drag.y), rem = raw - drag.offset;
    let want = Math.round((drag.spent + Math.max(0, rem)) / 50) * 50;
    if (rem < 25 || raw <= 0) want = drag.spent; // at (or below) the bottom: empty, exactly what's been spent
    const alloc = Math.max(drag.min, Math.min(want, drag.max));
    if (alloc !== drag.alloc && navigator.vibrate && Math.floor(alloc / 500) !== Math.floor(drag.alloc / 500)) { try { navigator.vibrate(4); } catch (err) {} }
    drag.alloc = alloc;
    // the water follows the finger exactly; the numbers snap to ₱50
    const visRem = raw <= 0 ? drag.min - drag.spent : Math.max(drag.min - drag.spent, Math.min(rem, drag.max - drag.spent));
    paintDrag(Math.max(0, visRem));
  }
  function paintDrag(visRem) {
    const d = drag, el = d.tankEl, E = d.els, rem = d.alloc - d.spent, pct = d.geom.pct(visRem);
    E.liquid.style.height = pct + '%';
    E.grab.style.bottom = grabPos(pct);
    if (d.isSave) {
      E.left.textContent = peso(d.past + d.alloc);
      E.of.textContent = saveSub(d.alloc, d.month);
    } else {
      E.line.style.bottom = Math.min(98, d.geom.pct(d.alloc)) + '%';
      E.left.textContent = rem < 0 ? peso(-rem) + ' over' : peso(rem);
      E.of.textContent = d.alloc ? 'left of ' + peso(d.alloc) : 'no budget yet';
      const tone = 'tone-' + toneOf(d.alloc, rem);
      if (!el.classList.contains(tone)) { el.classList.remove('tone-ok', 'tone-low', 'tone-out'); el.classList.add(tone); }
      el.classList.toggle('over', rem < 0);
    }
    const visAlloc = d.spent + visRem, unassigned = d.income - d.others - d.alloc;
    $('incomeAmt').textContent = peso(Math.max(0, unassigned));
    if ($('incomeLiquid')) $('incomeLiquid').style.height = (d.income > 0 ? Math.max(0, Math.min(100, (d.income - d.others - visAlloc) / d.income * 100)) : 0) + '%';
    const delta = d.alloc - d.startAlloc;
    const svg = $('pourSvg');
    svg.classList.toggle('back', delta < 0);
    svg.classList.toggle('idle', delta === 0);
    $('pourTag').textContent = delta === 0 ? '' : (delta > 0 ? '+' : '−') + peso(Math.abs(delta));
    $('pourTag').classList.toggle('back', delta < 0);
  }
  // A crisp line along the plumbing: down the spine from the Income tank, then across into the tank being filled.
  function showPour() {
    const box = document.querySelector('.plumbing').getBoundingClientRect(), inc = $('incomeCard').querySelector('.tank').getBoundingClientRect(), t = drag.rect;
    const sx = box.width / 2, sy = inc.bottom - box.top - 2;
    let ty = t.top - box.top + t.height / 2, d;
    if (drag.isSave) { ty = t.top - box.top; d = `M${sx} ${sy} V${ty}`; }
    else {
      const left = t.left + t.width / 2 < box.left + sx, tx = left ? t.right - box.left : t.left - box.left, r = Math.min(10, Math.abs(tx - sx));
      d = `M${sx} ${sy} V${ty - r} Q${sx} ${ty} ${sx + (left ? -r : r)} ${ty} H${tx}`;
    }
    $('pourBase').setAttribute('d', d); $('pourFlow').setAttribute('d', d);
    const len = $('pourBase').getTotalLength ? $('pourBase').getTotalLength() : 600;
    const svg = $('pourSvg');
    svg.style.setProperty('--len', len);
    svg.classList.remove('on', 'back', 'idle'); void svg.getBoundingClientRect(); svg.classList.add('on', 'idle');
    document.querySelector('.plumbing').classList.add('pouring');
    const tag = $('pourTag');
    tag.style.left = sx + 'px'; tag.style.top = (drag.isSave ? ty + 10 : ty - 30) + 'px'; tag.textContent = '';
  }
  function hidePour() { $('pourSvg').classList.remove('on'); document.querySelector('.plumbing').classList.remove('pouring'); $('pourTag').textContent = ''; }
  function endDrag() {
    if (!drag) return;
    if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; frameDrag(); }
    const d = drag; drag = null;
    hidePour();
    if (d.moved) {
      lastDragEnd = Date.now();
      if (d.alloc !== d.startAlloc) { if (d.isSave && !d.alloc) removeAlloc(viewScope, d.month, SAVE); else setAlloc(viewScope, d.month, d.cat, d.alloc); persist(); }
    }
    if (pendingServerVal) { const v = pendingServerVal; pendingServerVal = null; applyServer(v); }
    else if (d.moved) renderTanks(); // a plain tap leaves the DOM alone so its click still opens the tank
  }

  function repeatPlan(pid, fromMonth, toMonth) {
    state.allocations.filter(a => a.profileId === pid && a.month === fromMonth).forEach(a => setAlloc(pid, toMonth, a.categoryId, a.amount));
    store(WRAP_KEY + '-' + pid + '-' + fromMonth, '1');

  }

  function openAddTank() {

  function openTankDetail(cat) {

    const subs = Object.entries(subTotals).sort((a, b) => b[1] - a[1]);

    const otherTanks = isT ? [] : tankCats([viewScope], month).filter(x => x !== cat);

      <div class="modal-title" style="color:var(--text);font-weight:800">${ci(c, 26)}${esc(c.name)}</div>

      </div>

      ${isT ? `<div class="person-rows">${pids.map(pid => { const i = tankInfo(pid, month, cat), p = profileById(pid); return `<div class="prow">${mono(p, 30)}<div class="pmain"><div class="ptop"><b>${esc(p.name)}</b><span>${leftText(i.remaining)}<em> left of ${peso(i.alloc)}</em></span></div><div class="bar"><i style="width:${i.alloc > 0 ? Math.max(0, Math.min(100, i.remaining / i.alloc * 100)).toFixed(1) : 0}%;background:var(${personTone(pid)})"></i></div></div></div>`; }).join('')}</div>` : ''}
      ${isT ? '' : `

      <div id="tdForm"></div>

      ${subs.length ? `<div class="h2" style="margin:16px 0 10px">Where it drained</div>` + subs.map(([sid, amt]) => `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-weight:600"><span>${ci(catById(sid))}${sid === cat ? esc(c.name) + ' (general)' : esc(catById(sid).name)}</span><span>${peso(amt)}</span></div><div class="bar"><i style="width:${(amt / spent * 100).toFixed(1)}%"></i></div></div>`).join('') : ''}
      <div class="h2" style="margin:16px 0 10px">This month</div>
      ${entries.length ? entries.map(e => entryRowHTML(e, isT)).join('') : '<div class="empty-state" style="padding:16px">Nothing spent here yet.</div>'}
      ${!isT && hasAlloc(viewScope, month, cat) && !spent ? '<button class="secondary-btn" id="tdRemove">Remove this tank for ' + esc(monthName(month)) + '</button>' : ''}`;
    bindEntryRows(modalBody());
    if (!isT) {
      const showForm = html => { $('tdForm').innerHTML = `<div class="inline-form">${html}</div>`; };
      $('tdTopUp').addEventListener('click', () => {

        <div class="modal-actions"><button class="modal-save" id="mCancel">Done</button></div>`;
      const rowHTML = (c, isSub) => {
        const hasSubs = subsOf(c.id).length > 0;
        const parentOpts = `<option value="">— main category —</option>` + tops.filter(t => t.id !== c.id).map(t => `<option value="${t.id}" ${c.parentId === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
        return `<div data-id="${c.id}" style="margin-bottom:10px;${isSub ? 'padding-left:18px;border-left:2px solid var(--line)' : ''}">
          <div class="field-row" style="margin-bottom:6px;align-items:center"><button class="glyph-btn" data-pick="${c.id}" aria-label="Change icon for ${esc(c.name)}" aria-expanded="${pickOpen === c.id}">${ico(catGlyph(c), 20)}</button><input type="text" class="cat-name" value="${esc(c.name)}" aria-label="Name"><button class="grip cat-del" data-del="${c.id}" aria-label="Delete ${esc(c.name)}" style="color:var(--minus)">${ico('x', 18)}</button>${isSub ? '' : `<button class="grip" aria-label="Drag to reorder">${GRIP}</button>`}</div>
          ${pickOpen === c.id ? glyphPickerHTML(CAT_GLYPHS, c.glyph && G[c.glyph] ? c.glyph : '', guessGlyph(c.name, CAT_WORDS, c.type === 'income' ? 'coins' : 'tag')) : ''}
          <select class="cat-parent" ${hasSubs ? 'disabled' : ''} aria-label="Parent category" style="font-size:14px;min-height:40px">${hasSubs ? '<option>Main category (has subcategories)</option>' : parentOpts}</select></div>`;
      };
      $('catList').innerHTML = tops.map(top => `<div class="sortable-item" data-sort-id="${top.id}">${rowHTML(top, false)}${subsOf(top.id).map(s => rowHTML(s, true)).join('')}</div>`).join('');
      $$('[data-ctype]', modalBody()).forEach(b => b.addEventListener('click', () => { activeTab = b.dataset.ctype; draw(); }));
      $$('.cat-name', modalBody()).forEach(inp => inp.addEventListener('change', () => {
        const row = inp.closest('[data-id]'), cat = state.categories.find(c => c.id === row.dataset.id); if (!cat) return;
        cat.name = inp.value.trim() || cat.name; persist(); renderAll();
        const b = row.querySelector('.glyph-btn'); if (b) b.innerHTML = ico(catGlyph(cat), 20);
      }));
      $$('[data-pick]', modalBody()).forEach(b => b.addEventListener('click', () => { pickOpen = pickOpen === b.dataset.pick ? null : b.dataset.pick; const y = $('modalSheet').scrollTop; draw(); $('modalSheet').scrollTop = y; }));
      $$('[data-glyph]', modalBody()).forEach(b => b.addEventListener('click', () => {
        const cat = state.categories.find(c => c.id === pickOpen); if (!cat) return;
        if (b.dataset.glyph) cat.glyph = b.dataset.glyph; else delete cat.glyph;
        pickOpen = null; persist(); const y = $('modalSheet').scrollTop; draw(); $('modalSheet').scrollTop = y; renderAll();
      }));
      $$('.cat-parent:not([disabled])', modalBody()).forEach(sel => sel.addEventListener('change', () => {
        const row = sel.closest('[data-id]'), cat = state.categories.find(c => c.id === row.dataset.id); if (!cat) return;
        cat.parentId = sel.value || null; persist(); draw(); renderAll();
      }));
      $$('[data-del]', modalBody()).forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.del;
        if (state.entries.some(e => e.categoryId === id)) { toast('Entries use this category. Change or delete them first.'); return; }
        if (state.categories.some(c => c.parentId === id)) { toast('This category has subcategories. Move or delete those first.'); return; }
        if (state.recurring.some(r => r.categoryId === id)) { toast('A recurring entry uses this category. Change or delete it first.'); return; }
        state.categories = state.categories.filter(c => c.id !== id);
        state.budgets = state.budgets.filter(x => x.categoryId !== id);
        state.allocations = state.allocations.filter(x => x.categoryId !== id);
        persist(); draw(); renderAll();
      }));
      makeSortable($('catList'), ids => { reorder('categories', ids); draw(); });
      $('addCatBtn').addEventListener('click', () => { state.categories.push({ id: uid(), name: 'New', icon: '✨', type: activeTab, ord: Date.now() }); persist(); draw(); renderAll(); });

    draw(); openOverlay();
  }

  function openProfilesModal() {
    function draw() {
      modalBody().innerHTML = `<div class="modal-title">People</div><div id="profList"></div><button class="secondary-btn" id="addProfBtn">+ Add person</button><div class="modal-actions"><button class="modal-save" id="mCancel">Done</button></div>`;
      $('profList').innerHTML = state.profiles.map(p => `<div class="field-row" data-id="${p.id}" style="align-items:center">${mono(p, 36)}<input type="text" class="prof-name" value="${esc(p.name)}" aria-label="Name"><button class="grip" data-del="${p.id}" style="color:var(--minus)" aria-label="Remove ${esc(p.name)}">${ico('x', 18)}</button></div>`).join('');

      $$('[data-del]', modalBody()).forEach(b => b.addEventListener('click', () => {

        state.profiles = state.profiles.filter(p => p.id !== id);

  // ---------- account / patch notes / export ----------

  function downloadFile(name, content, type) {
    if (DEMO) { toast('Downloads are off in the demo — they work in the real app.'); return; }
    const blob = new Blob([content], { type }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function downloadBackup() { downloadFile(`ledger-backup-${localDateStr()}.json`, JSON.stringify(state, null, 2), 'application/json'); }
  function exportCSV() {
    if (!state.entries.length) { toast('No entries to export yet.'); return; }

    const rows = state.entries.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(e => [localDateStr(new Date(e.date)), profileById(e.profileId).name, e.type, walletById(e.walletId).name, e.type === 'transfer' ? walletById(e.toWalletId).name : '', e.type === 'transfer' ? '' : categoryLabel(e.categoryId), e.amountPHP.toFixed(2), e.originalAmount != null ? e.originalAmount : '', e.originalCurrency || '', e.note || '']);
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    downloadFile(`transactions-${localDateStr()}.csv`, '﻿' + [headers.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n'), 'text/csv;charset=utf-8;');

  // ---------- login ----------

  function showLoginMsg(text, ok) { const el = $('loginError'); el.style.color = ok ? 'var(--plus)' : 'var(--minus)'; el.textContent = text; el.style.display = 'block'; }
  function friendlyAuthError(err) {
    const map = { 'auth/invalid-credential': 'Email or password is incorrect.', 'auth/invalid-login-credentials': 'Email or password is incorrect.', 'auth/wrong-password': 'Email or password is incorrect.', 'auth/user-not-found': 'Email or password is incorrect.', 'auth/email-already-in-use': 'An account with this email already exists. Log in instead.', 'auth/invalid-email': "That email address isn't valid.", 'auth/weak-password': 'Use a password with at least 6 characters.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.', 'auth/network-request-failed': 'No connection. Check your internet and try again.', 'auth/admin-restricted-operation': 'New sign-ups are turned off for this ledger.', 'auth/operation-not-allowed': 'New sign-ups are turned off for this ledger.' };
    return map[(err && err.code) || ''] || (err && err.message) || 'Something went wrong. Try again.';
  }
  $('loginToggleBtn').addEventListener('click', () => setLoginMode(loginMode === 'login' ? 'signup' : 'login'));
